<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Conversor de temperaturas entre Celsius, Fahrenheit y Kelvin."
  />
  <title>Conversor de Temperaturas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="converter-card" aria-labelledby="app-title">
      <header class="app-header">
        <div class="thermometer-icon" aria-hidden="true">🌡️</div>
        <div>
          <h1 id="app-title">Conversor de Temperaturas</h1>
          <p>Convierte fácilmente entre Celsius, Fahrenheit y Kelvin.</p>
        </div>
      </header>

      <div class="temperature-status" aria-live="polite">
        <span id="status-dot" class="status-dot neutral"></span>
        <span id="status-text">Ingresa una temperatura para comenzar</span>
      </div>

      <form id="converter-form" novalidate>
        <div class="field-group">
          <label for="temperature">Temperatura</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">°</span>
            <input
              id="temperature"
              name="temperature"
              type="number"
              step="any"
              inputmode="decimal"
              placeholder="Ej. 25"
              autocomplete="off"
            />
          </div>
          <p id="error-message" class="error-message" role="alert"></p>
        </div>

        <div class="units-grid">
          <div class="field-group">
            <label for="from-unit">Unidad de origen</label>
            <select id="from-unit" name="from-unit">
              <option value="celsius">Celsius (°C)</option>
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>

          <button
            id="swap-button"
            class="swap-button"
            type="button"
            aria-label="Intercambiar unidades"
            title="Intercambiar unidades"
          >
            ⇄
          </button>

          <div class="field-group">
            <label for="to-unit">Unidad de destino</label>
            <select id="to-unit" name="to-unit">
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="celsius">Celsius (°C)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <section class="result-card" aria-live="polite" aria-atomic="true">
          <span class="result-label">Resultado</span>
          <strong id="result-value">—</strong>
          <span id="result-formula" class="result-formula">
            La conversión aparecerá aquí
          </span>
        </section>

        <div class="actions">
          <button id="clear-button" class="secondary-button" type="button">
            Limpiar
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
